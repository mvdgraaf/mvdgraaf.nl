server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy Matomo tracker requests to the Matomo container so tracker is served from same origin
  location = /matomo.php {
    proxy_pass http://matomo:80/matomo.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /matomo.js {
    proxy_pass http://matomo:80/matomo.js;
    proxy_set_header Host $host;
  }

  # Alternative analytics endpoints (less likely to be blocked by adblockers)
  location = /analytics/tracker.js {
    proxy_pass http://matomo:80/matomo.js;
    proxy_set_header Host $host;
  }

  location = /analytics/collect {
    proxy_pass http://matomo:80/matomo.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

